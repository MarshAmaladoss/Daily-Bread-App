<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Catholic India</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,600&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; }
        .serif { font-family: 'Crimson Pro', serif; }
        .reading-text { line-height: 1.8; color: #374151; font-size: 1.1rem; margin-bottom: 2rem; }
        .label { color: #065f46; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 1rem; display: block; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center">

    <div id="app-card" class="max-w-2xl w-full bg-white shadow-2xl rounded-[2.5rem] overflow-hidden hidden border border-stone-200">
        <div class="bg-stone-900 p-10 text-white relative">
            <p id="date-label" class="text-emerald-400 text-xs font-bold uppercase tracking-[0.4em] mb-2"></p>
            <h1 id="saint-name" class="serif text-3xl font-bold italic leading-tight">Daily Mass</h1>
        </div>

        <div class="p-10">
            <div id="main-readings" class="reading-text">
                </div>

            <div class="bg-emerald-900 rounded-[2.5rem] p-10 text-center text-white shadow-lg">
                <h4 class="serif text-2xl font-bold mb-4 italic">Daily Prayer</h4>
                <p id="dynamic-prayer" class="text-emerald-100 italic leading-relaxed text-lg">
                    "Lord, guide our hearts by Your Word today. Amen."
                </p>
            </div>
        </div>
    </div>

    <div id="status-container" class="flex flex-col items-center justify-center min-h-[80vh] text-center px-6">
        <div id="spinner" class="w-12 h-12 border-4 border-stone-200 border-t-emerald-800 rounded-full animate-spin mb-6"></div>
        <p id="status-msg" class="serif italic text-stone-500 text-xl">Connecting to the Word...</p>
        <button id="retry-btn" onclick="location.reload()" class="hidden mt-8 bg-stone-900 text-white px-8 py-3 rounded-full font-bold shadow-xl">Refresh Connection</button>
    </div>

    <script>
        async function fetchIndiaLiturgy() {
            const statusMsg = document.getElementById('status-msg');
            const retryBtn = document.getElementById('retry-btn');

            try {
                // We use Universalis with a forced refresh to avoid stale Indian cache
                const timestamp = new Date().getTime();
                const response = await fetch(`https://www.universalis.com/Europe.Ireland/jsonnext.js?cb=${timestamp}`);
                
                // Since this is a JSONP style API, we'll use the callback logic
                const script = document.createElement('script');
                script.src = `https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=renderData&cb=${timestamp}`;
                document.body.appendChild(script);

            } catch (err) {
                statusMsg.innerText = "Network Error. Please try refreshing.";
                retryBtn.classList.remove('hidden');
            }
        }

        window.renderData = function(data) {
            if (!data || !data.Mass_Reading) {
                document.getElementById('status-msg').innerText = "Data error. Please refresh.";
                return;
            }

            document.getElementById('date-label').innerText = data.date;
            document.getElementById('saint-name').innerText = data.day;
            
            const m = data.Mass_Reading;
            let content = "";
            if (m.Reading1) content += `<span class="label">First Reading</span><div>${m.Reading1.text}</div>`;
            if (m.Psalm) content += `<span class="label">Responsorial Psalm</span><div class="serif italic">${m.Psalm.text}</div>`;
            if (m.Reading2) content += `<span class="label">Second Reading</span><div>${m.Reading2.text}</div>`;
            if (m.Gospel) content += `<span class="label">Holy Gospel</span><div class="serif italic text-xl border-l-4 border-emerald-600 pl-6">${m.Gospel.text}</div>`;

            document.getElementById('main-readings').innerHTML = content;
            document.getElementById('dynamic-prayer').innerText = `Heavenly Father, through the intercession of ${data.day}, grant that Your Word may bear fruit in us today. Amen.`;

            document.getElementById('status-container').classList.add('hidden');
            document.getElementById('app-card').classList.remove('hidden');
        };

        // Safety Timeout for Indian Networks
        setTimeout(() => {
            if (document.getElementById('app-card').classList.contains('hidden')) {
                document.getElementById('status-msg').innerText = "Connection is taking longer than expected...";
                document.getElementById('retry-btn').classList.remove('hidden');
            }
        }, 8000);

        fetchIndiaLiturgy();
    </script>
</body>
</html>
