<style>
    .show { display: block !important; }
</style>

<script>
    const dailyData = {
        "6": { date: "Wednesday, May 6", saint: "Saints Marian and James", type: "Martyrs", r1: "Acts 15:1-6", ps: "Psalm 122", gs: "John 15:1-8" },
        "7": { date: "Thursday, May 7", saint: "Saint Rose Venerini", type: "Virgin", r1: "Acts 15:7-21", ps: "Psalm 96", gs: "John 15:9-11" },
        "8": { date: "Friday, May 8", saint: "Saint Victor Maurus", type: "Martyr", r1: "Acts 15:22-31", ps: "Psalm 57", gs: "John 15:12-17" }
    };

    function toggleDropdown() { 
        document.getElementById("calendar-dropdown").classList.toggle("show"); 
    }
    
    function selectDate(day) {
        const data = dailyData[day];
        if (!data) return;

        document.getElementById('display-date').innerText = data.date + ", 2026";
        document.getElementById('display-saint').innerText = data.saint;
        document.getElementById('display-type').innerText = data.type;
        document.getElementById('ref-1').innerText = data.r1;
        document.getElementById('ref-psalm').innerText = data.ps;
        document.getElementById('ref-gospel').innerText = data.gs;
        
        // Update prayer based on Gospel theme
        const prayer = document.getElementById('display-prayer');
        if (day === "7") {
            prayer.innerText = '"Lord, keep us in Your love, so that our joy may be complete. Amen."';
        } else if (day === "8") {
            prayer.innerText = '"Help us to love one another, Lord, just as You have loved us. Amen."';
        }
        
        document.getElementById("calendar-dropdown").classList.remove('show');
    }

    async function openBible(ref) {
        if (!ref) return;
        const overlay = document.getElementById('bible-overlay');
        const content = document.getElementById('overlay-content');
        const title = document.getElementById('overlay-title');
        
        overlay.style.display = 'block';
        content.innerText = "Consulting the Holy Scriptures...";
        title.innerText = ref;

        try {
            const response = await fetch(`https://bible-api.com/${ref}`);
            const data = await response.json();
            content.innerHTML = data.text ? data.text.replace(/\n/g, '<br><br>') : "Reference not found.";
        } catch (e) { content.innerText = "Connection error. Please try again."; }
    }

    function closeBible() { document.getElementById('bible-overlay').style.display = 'none'; }
    
    // Init Calendar
    const drop = document.getElementById('calendar-dropdown');
    for (let i = 1; i <= 31; i++) {
        const btn = document.createElement('button');
        btn.innerText = "May " + i;
        btn.className = dailyData[i] ? "bg-emerald-50 font-bold" : "text-stone-400";
        btn.onclick = () => selectDate(i);
        drop.appendChild(btn);
    }

    // Initialize with Today's Date (May 7)
    window.onload = () => {
        selectDate("7");
    };

    window.onclick = (e) => { 
        if (!e.target.closest('.relative')) {
            document.getElementById("calendar-dropdown").classList.remove('show');
        }
    }
</script>
