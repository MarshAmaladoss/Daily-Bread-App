<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Universal Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        
        /* Interactive Reading Cards */
        .reading-card { border-left: 5px solid #065f46; padding: 1.25rem; margin-bottom: 1.25rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 0 1.5rem 1.5rem 0; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .reading-card:hover { background-color: #f0fdf4; border-left-width: 10px; transform: translateX(5px); }
        .reading-card:active { transform: scale(0.98); }

        /* Full Scripture Overlay */
        #bible-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; padding: 1.5rem; backdrop-filter: blur(4px); }
        .overlay-card { max-width: 32rem; margin: 2rem auto; bg: white; border-radius: 2.5rem; padding: 2.5rem; max-height: 85vh; overflow-y: auto; background: white; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center space-y-6">

    <div id="bible-overlay" onclick="closeBible()">
        <div class="overlay-card" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                <h3 id="overlay-title" class="serif text-2xl font-bold italic text-emerald-900">Scripture</h3>
                <button onclick="closeBible()" class="text-stone-400 text-3xl leading-none hover:text-stone-800">✕</button>
            </div>
            <div id="overlay-content" class="serif text-xl leading-relaxed text-stone-800 italic">
                Loading the Sacred Text...
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-white shadow-2xl rounded-[3rem] overflow-hidden border border-stone-200">
        <div class="bg-stone-900 p-10 text-white text-center">
            <p id="display-date" class="text-emerald-400 text-[10px] font-bold uppercase tracking-[0.5em] mb-3"></p>
            <h1 id="display-saint" class="serif text-4xl font-bold italic leading-tight">Daily Liturgy</h1>
            <p id="display-status" class="text-stone-500 text-[9px] uppercase tracking-widest mt-3">Catholic Church Universal</p>
        </div>
        
        <div class="p-8">
            <p class="text-[10px] text-stone-400 uppercase font-bold text-center mb-8 tracking-[0.2em]">Tap any reading to open the full Bible text</p>
            
            <div id="liturgy-list" class="space-y-4">
                <div class="animate-pulse space-y-4">
                    <div class="h-20 bg-stone-100 rounded-2xl"></div>
                    <div class="h-20 bg-stone-100 rounded-2xl"></div>
                    <div class="h-24 bg-stone-50 rounded-2xl"></div>
                </div>
            </div>

            <div class="mt-12 pt-8 border-t border-stone-100 text-center">
                <p class="text-[10px] text-stone-400 uppercase font-bold mb-3 tracking-widest">Daily Prayer</p>
                <p id="display-prayer" class="serif italic text-stone-700 text-xl leading-relaxed">
                    "Lord, let Your Word dwell in us richly today. Amen."
                </p>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-emerald-950 shadow-xl rounded-[2.5rem] p-8 text-white">
        <h3 class="serif text-xl mb-4 italic tracking-wide">Whole Bible Library</h3>
        <div class="flex gap-2">
            <input id="bible-input" type="text" placeholder="e.g. Matthew 5:1" class="flex-1 bg-white/10 border border-white/10 rounded-full px-5 py-3 text-sm text-white focus:outline-none placeholder:text-emerald-700">
            <button onclick="openBible(document.getElementById('bible-input').value)" class="bg-emerald-600 text-white px-8 py-3 rounded-full text-sm font-bold shadow-lg hover:bg-emerald-500 transition-all">Open</button>
        </div>
    </div>

    <script>
        // THE ENGINE: Universal Liturgical Logic
        function updateUI(data) {
            if (!data || !data.Mass_Reading) return;

            document.getElementById('display-date').innerText = data.date;
            document.getElementById('display-saint').innerText = data.day;
            
            const m = data.Mass_Reading;
            let listHtml = "";

            // Dynamic logic: Adds Second Reading automatically on Sundays/Feasts
            if (m.Reading1) listHtml += createCard("First Reading", m.Reading1.source);
            if (m.Psalm) listHtml += createCard("Responsorial Psalm", m.Psalm.source);
            if (m.Reading2) listHtml += createCard("Second Reading", m.Reading2.source);
            if (m.Gospel) listHtml += createCard("Holy Gospel", m.Gospel.source, true);

            document.getElementById('liturgy-list').innerHTML = listHtml;
            document.getElementById('display-prayer').innerText = `Heavenly Father, through the intercession of ${data.day}, grant us the grace to live Your Word today. Amen.`;
        }

        function createCard(title, ref, isGospel = false) {
            const bg = isGospel ? 'bg-emerald-50/50' : 'bg-white';
            const textStyle = isGospel ? 'text-2xl font-bold' : 'text-xl font-semibold';
            return `
                <div onclick="openBible('${ref}')" class="reading-card ${bg}">
                    <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest block mb-1">${title}</span>
                    <p class="${textStyle} text-stone-800">${ref}</p>
                </div>`;
        }

        // BIBLE FETCHING: Pulls full unabridged text from global database
        async function openBible(ref) {
            if (!ref) return;
            const overlay = document.getElementById('bible-overlay');
            const content = document.getElementById('overlay-content');
            const title = document.getElementById('overlay-title');
            
            overlay.style.display = 'block';
            content.innerText = "Consulting the Holy Scriptures...";
            title.innerText = ref;

            try {
                const response = await fetch(`https://bible-api.com/${ref}`);
                const data = await response.json();
                if (data.text) {
                    content.innerHTML = data.text.replace(/\n/g, '<br><br>');
                } else {
                    content.innerText = "Scripture not found. Please check the reference.";
                }
            } catch (e) {
                content.innerText = "Network Error. Please try again.";
            }
        }

        function closeBible() { document.getElementById('bible-overlay').style.display = 'none'; }

        // AUTO-FETCH: Using JSONP to bypass local ISP blocks
        const script = document.createElement('script');
        script.src = `https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=updateUI&cb=${new Date().getTime()}`;
        document.body.appendChild(script);

        // Fallback Date
        const today = new Date();
        document.getElementById('display-date').innerText = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    </script>
</body>
</html>
