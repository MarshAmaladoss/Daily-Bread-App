<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Universal Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        .reading-card { border-left: 5px solid #065f46; padding: 1.25rem; margin-bottom: 1.25rem; cursor: pointer; transition: all 0.3s; border-radius: 0 1.5rem 1.5rem 0; background: white; shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .reading-card:hover { background-color: #f0fdf4; border-left-width: 10px; transform: translateX(5px); }
        #bible-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; padding: 1.5rem; backdrop-filter: blur(4px); }
        
        /* Dropdown Styling */
        #calendar-drop { display: none; position: absolute; top: 100%; right: 0; background: white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-radius: 1rem; width: 220px; z-index: 50; max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; }
        #calendar-drop button { width: 100%; padding: 12px 20px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 14px; transition: 0.2s; }
        #calendar-drop button:hover { background: #f0fdf4; color: #065f46; }
        .show { display: block !important; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center space-y-6">

    <div id="bible-overlay" onclick="closeBible()">
        <div class="max-w-xl mx-auto bg-white rounded-[2.5rem] p-8 mt-10 shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 id="overlay-title" class="serif text-2xl font-bold italic text-emerald-900">Scripture</h3>
                <button onclick="closeBible()" class="text-stone-400 text-2xl">✕</button>
            </div>
            <div id="overlay-content" class="serif text-xl leading-relaxed text-stone-800 italic max-h-[60vh] overflow-y-auto pr-2">
                Proclaiming...
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-white shadow-2xl rounded-[3rem] overflow-hidden border border-stone-200">
        <div class="bg-stone-900 p-10 text-white relative">
            <div class="flex justify-between items-start">
                <div>
                    <p id="display-date" class="text-emerald-400 text-[10px] font-bold uppercase tracking-[0.4em] mb-2"></p>
                    <h1 id="display-saint" class="serif text-4xl font-bold italic leading-tight">Daily Liturgy</h1>
                </div>
                <div class="relative">
                    <button onclick="toggleCalendar()" class="bg-white/10 p-3 rounded-xl hover:bg-white/20 transition-all">📅</button>
                    <div id="calendar-drop">
                        </div>
                </div>
            </div>
        </div>
        
        <div class="p-8">
            <p class="text-[10px] text-stone-400 uppercase font-bold text-center mb-8 tracking-widest">Tap any reading to read full Bible text</p>
            
            <div id="liturgy-list" class="space-y-4">
                <div class="animate-pulse flex flex-col space-y-4">
                    <div class="h-16 bg-gray-100 rounded-xl"></div>
                    <div class="h-16 bg-gray-100 rounded-xl"></div>
                </div>
            </div>

            <div class="mt-12 pt-8 border-t text-center">
                <p class="text-[10px] text-stone-400 uppercase font-bold mb-3 tracking-widest">Daily Prayer</p>
                <p id="display-prayer" class="serif italic text-stone-700 text-xl leading-relaxed">
                    "Lord, let Your Word dwell in us richly today. Amen."
                </p>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-emerald-950 shadow-xl rounded-[2.5rem] p-8 text-white">
        <h3 class="serif text-xl mb-4 italic">Whole Bible Library</h3>
        <div class="flex gap-2">
            <input id="bible-input" type="text" placeholder="e.g. John 3:16" class="flex-1 bg-white/10 border border-white/10 rounded-full px-5 py-3 text-sm text-white focus:outline-none">
            <button onclick="openBible(document.getElementById('bible-input').value)" class="bg-emerald-600 text-white px-6 py-3 rounded-full text-sm font-bold shadow-lg">Open</button>
        </div>
    </div>

    <script>
        // 1. DATA RENDERING ENGINE
        function updateUI(data) {
            if (!data || !data.Mass_Reading) return;
            document.getElementById('display-date').innerText = data.date;
            document.getElementById('display-saint').innerText = data.day;
            
            const m = data.Mass_Reading;
            let listHtml = "";
            if (m.Reading1) listHtml += createCard("First Reading", m.Reading1.source);
            if (m.Psalm) listHtml += createCard("Responsorial Psalm", m.Psalm.source);
            if (m.Reading2) listHtml += createCard("Second Reading", m.Reading2.source);
            if (m.Gospel) listHtml += createCard("Holy Gospel", m.Gospel.source, true);
            document.getElementById('liturgy-list').innerHTML = listHtml;
            document.getElementById('display-prayer').innerText = `Heavenly Father, through the intercession of ${data.day}, grant us the grace to live Your Word today. Amen.`;
        }

        function createCard(title, ref, isGospel = false) {
            return `<div onclick="openBible('${ref}')" class="reading-card ${isGospel ? 'bg-emerald-50' : 'bg-white'}">
                <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest block mb-1">${title}</span>
                <p class="text-xl font-bold text-stone-800">${ref}</p>
            </div>`;
        }

        // 2. SCRIPTURE ENGINE
        async function openBible(ref) {
            if (!ref) return;
            const overlay = document.getElementById('bible-overlay');
            overlay.style.display = 'block';
            document.getElementById('overlay-title').innerText = ref;
            try {
                const res = await fetch(`https://bible-api.com/${ref}`);
                const data = await res.json();
                document.getElementById('overlay-content').innerHTML = data.text ? data.text.replace(/\n/g, '<br><br>') : "Not found.";
            } catch (e) { document.getElementById('overlay-content').innerText = "Network Error."; }
        }

        function closeBible() { document.getElementById('bible-overlay').style.display = 'none'; }
        function toggleCalendar() { document.getElementById('calendar-drop').classList.toggle('show'); }

        // 3. CALENDAR GENERATOR
        function loadDate(day) {
            const dateKey = `202605${day < 10 ? '0'+day : day}`;
            const s = document.createElement('script');
            s.src = `https://www.universalis.com/Europe.Ireland/${dateKey}/jsonnext.js?callback=updateUI`;
            document.body.appendChild(s);
            toggleCalendar(); // Automatically hide after selection
        }

        const drop = document.getElementById('calendar-drop');
        for (let i = 1; i <= 31; i++) {
            const btn = document.createElement('button');
            btn.innerText = `May ${i}, 2026`;
            btn.onclick = () => loadDate(i);
            drop.appendChild(btn);
        }

        // 4. AUTO-START (Today's Data)
        const script = document.createElement('script');
        script.src = `https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=updateUI&cb=${new Date().getTime()}`;
        document.body.appendChild(script);

        // Click outside to close
        window.onclick = (e) => { if (!e.target.closest('.relative')) document.getElementById('calendar-drop').classList.remove('show'); }
    </script>
</body>
</html>
