<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Click-to-Read Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 50; border-radius: 12px; max-height: 250px; overflow-y: auto; right: 0; }
        .dropdown-content button { width: 100%; padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .dropdown-content.show { display: block; }
        
        .reading-card { border-left: 4px solid #065f46; padding: 1rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s; border-radius: 0 1rem 1rem 0; }
        .reading-card:hover { background-color: #f0fdf4; border-left-width: 8px; }
        
        /* Full Scripture Overlay */
        #bible-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; padding: 2rem; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex flex-col items-center space-y-6">

    <!-- Bible Overlay -->
    <div id="bible-overlay" onclick="closeBible()">
        <div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-10 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 id="overlay-title" class="serif text-2xl font-bold italic text-emerald-900">Scripture</h3>
                <button onclick="closeBible()" class="text-stone-400 hover:text-stone-800">✕ Close</button>
            </div>
            <div id="overlay-content" class="serif text-xl leading-relaxed text-stone-800 italic">
                Loading...
            </div>
        </div>
    </div>

    <!-- Main Card -->
    <div class="max-w-md w-full bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-stone-200">
        <div class="bg-stone-900 p-8 text-white relative">
            <div class="flex justify-between items-start">
                <div>
                    <p id="display-date" class="text-emerald-400 text-[10px] font-bold uppercase tracking-[0.3em] mb-1">Loading Date...</p>
                    <h2 id="display-saint" class="serif text-3xl font-bold italic">Loading API...</h2>
                    <p id="display-type" class="text-red-400 text-[10px] uppercase font-black tracking-widest mt-1">...</p>
                </div>
                <div class="relative">
                    <button onclick="toggleDropdown()" class="bg-white/10 p-2 rounded-lg">📅</button>
                    <div id="calendar-dropdown" class="dropdown-content text-stone-800"></div>
                </div>
            </div>
        </div>
        
        <div class="p-8">
            <p class="text-[10px] text-stone-400 uppercase font-bold text-center mb-6 tracking-[0.2em]">Tap a reference to read full text</p>
            
            <div onclick="openBible(document.getElementById('ref-1').innerText)" class="reading-card">
                <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest">First Reading</span>
                <p id="ref-1" class="text-lg font-bold text-stone-800">Loading...</p>
            </div>

            <div onclick="openBible(document.getElementById('ref-psalm').innerText)" class="reading-card">
                <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest">Responsorial Psalm</span>
                <p id="ref-psalm" class="text-lg font-bold text-stone-800">Loading...</p>
            </div>

            <div onclick="openBible(document.getElementById('ref-gospel').innerText)" class="reading-card border-emerald-800 bg-emerald-50">
                <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest">Holy Gospel</span>
                <p id="ref-gospel" class="text-xl font-bold text-stone-900">Loading...</p>
            </div>

            <div class="mt-8 pt-6 border-t text-center">
                <p class="text-[10px] text-stone-400 uppercase font-bold mb-2">Daily Prayer</p>
                <p id="display-prayer" class="serif italic text-stone-700 text-lg leading-relaxed">
                    "Lord, help us to remain in You as branches on the True Vine. Amen."
                </p>
            </div>
        </div>
    </div>

    <!-- Whole Bible Search Box -->
    <div class="max-w-md w-full bg-emerald-900 shadow-xl rounded-[2rem] p-6 text-white">
        <h3 class="serif text-lg mb-3 italic">Whole Bible Search</h3>
        <div class="flex gap-2">
            <input id="bible-input" type="text" placeholder="e.g. Genesis 1" class="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-2 text-sm text-white focus:outline-none">
            <button onclick="openBible(document.getElementById('bible-input').value)" class="bg-white text-emerald-900 px-5 py-2 rounded-full text-sm font-bold">Open</button>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let currentViewDate = new Date(); 

        function toggleDropdown() { 
            document.getElementById("calendar-dropdown").classList.toggle("show"); 
        }

        // Formats date nicely (e.g., "Monday, May 11, 2026")
        function getFormattedDateString(dateObj) {
            return dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }

        // Formats date for the API (e.g., "2026-05-11")
        function getYYYYMMDD(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function selectDate(dateObj) {
            currentViewDate = new Date(dateObj); 
            const dateKey = getYYYYMMDD(currentViewDate); 
            
            // 1. Show Loading State
            document.getElementById('display-date').innerText = getFormattedDateString(currentViewDate);
            document.getElementById('display-saint').innerText = "Fetching Readings...";
            document.getElementById('display-type').innerText = "...";
            document.getElementById('ref-1').innerText = "Loading...";
            document.getElementById('ref-psalm').innerText = "Loading...";
            document.getElementById('ref-gospel').innerText = "Loading...";
            
            document.getElementById("calendar-dropdown").classList.remove("show");
            buildDropdown(); 

            try {
                // 2. CALL THE LECTIO API
                // We use HTTPS here to prevent mixed-content errors in modern browsers
                const response = await fetch(`https://lectio-api.org/api/v1/readings/${dateKey}`);
                
                if (!response.ok) throw new Error("API failed to fetch readings");
                
                const apiData = await response.json();

                // 3. MAP THE API JSON TO YOUR HTML
                // Note: Change keys like apiData.saint or apiData.firstReading to match the API's exact output if needed
                document.getElementById('display-saint').innerText = apiData.saint || "Daily Mass";
                document.getElementById('display-type').innerText = apiData.type || "Weekday";
                document.getElementById('ref-1').innerText = apiData.firstReading || "N/A";
                document.getElementById('ref-psalm').innerText = apiData.psalm || "N/A";
                document.getElementById('ref-gospel').innerText = apiData.gospel || "N/A";

            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('display-saint').innerText = "Readings Unavailable";
                document.getElementById('display-type').innerText = "Check Connection";
                document.getElementById('ref-1').innerText = "-";
                document.getElementById('ref-psalm').innerText = "-";
                document.getElementById('ref-gospel').innerText = "-";
            }
        }

        function buildDropdown() {
            const drop = document.getElementById('calendar-dropdown');
            drop.innerHTML = ""; 
            
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const monthName = currentViewDate.toLocaleDateString('en-US', { month: 'long' });
            
            // Calculate exact days in the current month
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 1; i <= daysInMonth; i++) {
                const btn = document.createElement('button');
                btn.innerText = `${monthName} ${i}`;
                btn.onclick = () => selectDate(new Date(year, month, i));
                drop.appendChild(btn);
            }
        }

        async function openBible(ref) {
            if (!ref || ref === "Loading..." || ref === "N/A" || ref === "-") return;
            const overlay = document.getElementById('bible-overlay');
            const content = document.getElementById('overlay-content');
            const title = document.getElementById('overlay-title');
            
            overlay.style.display = 'block';
            content.innerText = "Consulting the Holy Scriptures...";
            title.innerText = ref;

            try {
                const response = await fetch(`https://bible-api.com/${ref}`);
                const data = await response.json();
                content.innerHTML = data.text ? data.text.replace(/\n/g, '<br><br>') : "Reference not found.";
            } catch (e) { 
                content.innerText = "Connection error. Please try again."; 
            }
        }

        function closeBible() { 
            document.getElementById('bible-overlay').style.display = 'none'; 
        }

        // Close dropdown if clicking outside of it
        window.onclick = (e) => { 
            if (!e.target.closest('.relative')) {
                document.getElementById("calendar-dropdown").classList.remove('show'); 
            }
        }

        // Init the application on load
        window.addEventListener('DOMContentLoaded', () => {
            selectDate(new Date()); 
        });
    </script>
</body>
</html>
