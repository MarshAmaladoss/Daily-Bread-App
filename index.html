<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Catholic Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://catholicsaints.info/wp-content/uploads/saints-marian-and-james.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        .reading-card { border-left: 5px solid #065f46; padding: 1.25rem; margin-bottom: 1.25rem; cursor: pointer; border-radius: 0 1.5rem 1.5rem 0; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: 0.3s; }
        .reading-card:hover { background-color: #f0fdf4; border-left-width: 10px; transform: translateX(5px); }
        #bible-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; padding: 1.5rem; backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center space-y-6">

    <div id="bible-overlay" onclick="this.style.display='none'">
        <div class="max-w-xl mx-auto bg-white rounded-[2.5rem] p-8 mt-10 shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 id="overlay-title" class="serif text-2xl font-bold italic text-emerald-900 text-center w-full">Scripture</h3>
                <button onclick="document.getElementById('bible-overlay').style.display='none'" class="text-stone-400 text-2xl absolute right-8">✕</button>
            </div>
            <div id="overlay-content" class="serif text-xl leading-relaxed text-stone-800 italic max-h-[60vh] overflow-y-auto pr-2">
                Proclaiming...
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-white shadow-2xl rounded-[3.1rem] overflow-hidden border border-stone-200">
        <div class="bg-stone-900 p-10 text-white text-center">
            <p id="display-date" class="text-emerald-400 text-[10px] font-bold uppercase tracking-[0.5em] mb-3"></p>
            <h1 id="display-saint" class="serif text-4xl font-bold italic leading-tight">Daily Liturgy</h1>
        </div>
        
        <div class="p-8">
            <p class="text-[10px] text-stone-400 uppercase font-bold text-center mb-8 tracking-widest">Tap any reading to read full Bible text</p>
            
            <div id="liturgy-list" class="space-y-4">
                <div class="animate-pulse space-y-4">
                    <div class="h-20 bg-stone-100 rounded-2xl"></div>
                    <div class="h-20 bg-stone-100 rounded-2xl"></div>
                </div>
            </div>

            <div class="mt-12 pt-8 border-t border-stone-100 text-center">
                <p class="text-[10px] text-stone-400 uppercase font-bold mb-3 tracking-widest">Daily Prayer</p>
                <p id="display-prayer" class="serif italic text-stone-700 text-xl leading-relaxed">
                    "Lord, let Your Word dwell in us richly today. Amen."
                </p>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full bg-emerald-950 shadow-xl rounded-[2.5rem] p-8 text-white">
        <h3 class="serif text-xl mb-4 italic text-center">Whole Bible Library</h3>
        <div class="flex gap-2">
            <input id="bible-input" type="text" placeholder="e.g. Genesis 1:1" class="flex-1 bg-white/10 rounded-full px-5 py-3 text-sm text-white focus:outline-none placeholder:text-emerald-700">
            <button onclick="openBible(document.getElementById('bible-input').value)" class="bg-emerald-600 text-white px-8 py-3 rounded-full text-sm font-bold shadow-lg">Open</button>
        </div>
    </div>

    <script>
        // THE ENGINE: General self-updating logic
        function updateUI(data) {
            if (!data || !data.Mass_Reading) return;

            document.getElementById('display-date').innerText = data.date;
            document.getElementById('display-saint').innerText = data.day;
            
            const m = data.Mass_Reading;
            let listHtml = "";

            // Automatically builds the reading list based on the day
            if (m.Reading1) listHtml += createCard("First Reading", m.Reading1.source);
            if (m.Psalm) listHtml += createCard("Responsorial Psalm", m.Psalm.source);
            if (m.Reading2) listHtml += createCard("Second Reading", m.Reading2.source);
            if (m.Gospel) listHtml += createCard("Holy Gospel", m.Gospel.source, true);

            document.getElementById('liturgy-list').innerHTML = listHtml;
            document.getElementById('display-prayer').innerText = `Heavenly Father, through the intercession of ${data.day}, grant us the grace to live Your Word today. Amen.`;
        }

        function createCard(title, ref, isGospel = false) {
            return `
                <div onclick="openBible('${ref}')" class="reading-card ${isGospel ? 'bg-emerald-50' : 'bg-white'}">
                    <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-widest block mb-1">${title}</span>
                    <p class="text-xl font-bold text-stone-800">${ref}</p>
                </div>`;
        }

        async function openBible(ref) {
            if (!ref) return;
            document.getElementById('bible-overlay').style.display = 'block';
            document.getElementById('overlay-title').innerText = ref;
            try {
                const res = await fetch(`https://bible-api.com/${ref}`);
                const data = await res.json();
                document.getElementById('overlay-content').innerHTML = data.text ? data.text.replace(/\n/g, '<br><br>') : "Reference not found.";
            } catch (e) { document.getElementById('overlay-content').innerText = "Network block. Please check connection."; }
        }

        // Bypasses Indian ISP cache to ensure May 10 readings load correctly
        const script = document.createElement('script');
        script.src = `https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=updateUI&cb=${new Date().getTime()}`;
        document.body.appendChild(script);

        // Immediate Date for Sunday, May 10, 2026
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    </script>
</body>
</html>
