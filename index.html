<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Roman Catholic Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f1ea; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        .mass-text { line-height: 1.8; color: #374151; font-size: 1.1rem; }
        .mass-text b { color: #064e3b; display: block; margin-top: 2rem; font-family: 'Inter', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin-bottom: 1rem;}
        .mass-text i { font-family: 'Crimson Pro', serif; font-size: 1.3rem; color: #111827; display: block; font-style: italic; margin-bottom: 1rem; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex justify-center">

    <div id="app-card" class="max-w-2xl w-full bg-white shadow-2xl rounded-[2.5rem] overflow-hidden hidden">
        <div class="bg-stone-900 p-10 text-white relative">
            <p id="date-label" class="text-emerald-400 text-xs font-bold uppercase tracking-[0.4em] mb-2"></p>
            <h1 id="day-title" class="serif text-3xl font-bold italic leading-tight">Daily Mass</h1>
        </div>

        <div class="p-10 space-y-12">
            <div id="mass-content" class="mass-text">
                </div>

            <section class="bg-emerald-900 rounded-[2rem] p-10 text-center text-white">
                <h4 class="serif text-2xl font-bold mb-4">Daily Prayer</h4>
                <p id="prayer-text" class="text-emerald-100 italic text-lg leading-relaxed"></p>
            </section>
        </div>
    </div>

    <div id="loading" class="flex flex-col items-center justify-center min-h-[80vh] text-center px-6">
        <div class="w-12 h-12 border-4 border-stone-200 border-t-emerald-800 rounded-full animate-spin mb-6"></div>
        <p id="status-msg" class="serif italic text-stone-500 text-xl">Opening the Holy Scriptures...</p>
        <button id="retry-btn" onclick="location.reload()" class="hidden mt-8 bg-emerald-800 text-white px-8 py-3 rounded-full font-bold shadow-lg">Try Again</button>
    </div>

    <script>
        // Callback function that Universalis calls automatically
        function universalisCallback(data) {
            if (!data || !data.Mass_Reading) {
                document.getElementById('status-msg').innerText = "Data received but format was unexpected. Retrying...";
                return;
            }

            document.getElementById('date-label').innerText = data.date;
            document.getElementById('day-title').innerText = data.day;

            let fullLiturgy = "";
            const m = data.Mass_Reading;
            
            if (m.Reading1) fullLiturgy += `<b>First Reading</b> ${m.Reading1.text}`;
            if (m.Psalm) fullLiturgy += `<b>Responsorial Psalm</b> ${m.Psalm.text}`;
            if (m.Reading2) fullLiturgy += `<b>Second Reading</b> ${m.Reading2.text}`;
            if (m.Gospel) fullLiturgy += `<b>Holy Gospel</b> ${m.Gospel.text}`;

            document.getElementById('mass-content').innerHTML = fullLiturgy;
            document.getElementById('prayer-text').innerText = `Lord, through the intercession of ${data.day}, may Your holy Word guide our path and bear fruit in our lives today. Amen.`;

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app-card').classList.remove('hidden');
        }

        // Safety timeout - shows retry button after 12 seconds
        setTimeout(() => {
            if (document.getElementById('app-card').classList.contains('hidden')) {
                document.getElementById('status-msg').innerText = "The connection is slow. Please check your internet.";
                document.getElementById('retry-btn').classList.remove('hidden');
            }
        }, 12000);
    </script>

    <script src="https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=universalisCallback"></script>

</body>
</html>
