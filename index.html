<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Catholic Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,600&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; }
        .serif { font-family: 'Crimson Pro', serif; }
        .reading-section { border-bottom: 1px solid #e7e5e4; padding-bottom: 2rem; margin-bottom: 2rem; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center">

    <div id="app-container" class="max-w-2xl w-full bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-stone-200">
        
        <div class="bg-stone-900 p-10 text-white relative">
            <p id="date-label" class="text-emerald-400 text-xs font-bold uppercase tracking-[0.4em] mb-2"></p>
            <h1 id="saint-name" class="serif text-3xl font-bold italic leading-tight">Daily Liturgy</h1>
        </div>

        <div class="p-10">
            <section class="reading-section">
                <h3 class="text-[10px] font-black text-emerald-800 bg-emerald-50 px-2 py-1 rounded inline-block uppercase mb-4 tracking-widest">First Reading</h3>
                <div id="reading-1-content" class="text-stone-700 leading-relaxed text-lg">
                    Loading today's scripture...
                </div>
            </section>

            <section class="reading-section bg-stone-50 p-8 rounded-[2rem] border border-stone-100">
                <h3 class="text-[10px] font-black text-stone-400 uppercase tracking-widest mb-4">Responsorial Psalm</h3>
                <div id="psalm-content" class="serif text-2xl italic text-emerald-900">
                    Loading Psalm...
                </div>
            </section>

            <section class="reading-section border-none">
                <h3 class="text-[10px] font-black text-white bg-stone-900 px-3 py-1 rounded inline-block uppercase mb-6 tracking-widest">Holy Gospel</h3>
                <div id="gospel-content" class="serif text-2xl text-stone-900 leading-relaxed italic border-l-4 border-emerald-600 pl-8">
                    Proclaiming the Good News...
                </div>
            </section>

            <div class="bg-emerald-900 rounded-[2.5rem] p-10 text-center text-white shadow-lg">
                <h4 class="serif text-2xl font-bold mb-4 italic">Daily Prayer</h4>
                <p id="dynamic-prayer" class="text-emerald-100 italic leading-relaxed text-lg">
                    "Lord, guide our hearts by Your Word today. Amen."
                </p>
            </div>
        </div>
    </div>

    <script>
        // This function handles the data from the Universalis API
        function universalisCallback(data) {
            if (!data || !data.Mass_Reading) return;

            // 1. Update UI with Full Text
            document.getElementById('date-label').innerText = data.date;
            document.getElementById('saint-name').innerText = data.day;
            
            const mass = data.Mass_Reading;
            document.getElementById('reading-1-content').innerHTML = mass.Reading1.text;
            document.getElementById('psalm-content').innerHTML = mass.Psalm.text;
            document.getElementById('gospel-content').innerHTML = mass.Gospel.text;
            
            document.getElementById('dynamic-prayer').innerText = `Heavenly Father, through the intercession of ${data.day}, grant that we may live according to Your Word today. Amen.`;
        }

        // 2. Load the data using a script tag (bypasses most network blocks)
        const script = document.createElement('script');
        script.src = "https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=universalisCallback";
        document.body.appendChild(script);

        // 3. Update the date immediately so it doesn't look blank
        const today = new Date();
        document.getElementById('date-label').innerText = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    </script>
</body>
</html>
