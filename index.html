<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgical Calendar & Bible</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h1 { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .date-picker { margin-bottom: 20px; }
        input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ddd; font-size: 1rem; }

        .section { margin-bottom: 25px; padding: 15px; border-radius: 8px; background: #fafafa; border-left: 5px solid var(--primary); }
        .section h3 { margin-top: 0; color: var(--accent); text-transform: uppercase; font-size: 0.9rem; }
        
        .reading-link { display: block; padding: 12px; margin: 8px 0; background: white; border: 1px solid #eee; border-radius: 5px; cursor: pointer; transition: 0.2s; text-decoration: none; color: var(--primary); font-weight: bold; }
        .reading-link:hover { background: #fff3e6; border-color: var(--accent); }

        #bible-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
        .bible-content { background: white; width: 90%; max-width: 600px; margin: 50px auto; padding: 30px; border-radius: 8px; position: relative; line-height: 1.6; }
        .close-btn { position: sticky; top: 0; float: right; font-size: 1.5rem; cursor: pointer; color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Liturgical Calendar</h1>
    
    <div class="date-picker">
        <label>Select Date: </label>
        <input type="date" id="dateInput">
    </div>

    <div id="liturgy-info">
        <div class="section">
            <h3>Saint / Martyr of the Day</h3>
            <p id="saint-name">Select a date to load info...</p>
        </div>

        <div class="section">
            <h3>Today's Readings</h3>
            <div id="readings-list">
                <!-- Links will appear here -->
            </div>
        </div>

        <div class="section">
            <h3>Prayer of the Day</h3>
            <p id="daily-prayer">Heavenly Father, guide us this day in your grace and peace. Amen.</p>
        </div>
    </div>
</div>

<!-- Bible Reader Overlay -->
<div id="bible-overlay">
    <div class="bible-content">
        <span class="close-btn" onclick="closeBible()">&times;</span>
        <h2 id="bible-title"></h2>
        <div id="bible-text">Loading...</div>
    </div>
</div>

<script>
    const dateInput = document.getElementById('dateInput');
    
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    // Listen for date change
    dateInput.addEventListener('change', (e) => fetchLiturgy(e.target.value));

    async function fetchLiturgy(date) {
        const [year, month, day] = date.split('-');
        const saintDisplay = document.getElementById('saint-name');
        const readingsList = document.getElementById('readings-list');

        try {
            // 1. Fetch Liturgical Data (Saint/Season)
            const response = await fetch(`https://calapi.inadiutorium.cz/api/v1/rituals/roman/calendar/${year}/${month}/${day}`);
            const data = await response.json();

            // Display Celebrations
            const celebrations = data.celebrations.map(c => c.title).join(", ");
            saintDisplay.innerText = celebrations || "Ferial Day (No specific Saint)";

            // 2. Fetch Readings (Mocking references since free APIs often require specific liturgical years)
            // In a production app, you would fetch from Universalis or a curated JSON DB
            // Here, we provide common Sunday-style structures for demo
            const mockReadings = [
                { title: "First Reading", ref: "Genesis 1:1-5" },
                { title: "Responsorial Psalm", ref: "Psalm 23" },
                { title: "Gospel", ref: "John 1:1-14" }
            ];

            readingsList.innerHTML = '';
            mockReadings.forEach(r => {
                const btn = document.createElement('a');
                btn.className = 'reading-link';
                btn.innerText = `${r.title}: ${r.ref}`;
                btn.onclick = () => openBible(r.ref);
                readingsList.appendChild(btn);
            });

        } catch (error) {
            saintDisplay.innerText = "Error loading data. Please try another date.";
        }
    }

    async function openBible(reference) {
        const overlay = document.getElementById('bible-overlay');
        const title = document.getElementById('bible-title');
        const content = document.getElementById('bible-text');

        overlay.style.display = 'block';
        title.innerText = reference;
        content.innerText = "Fetching full text...";

        try {
            // Using the Open Bible API
            const response = await fetch(`https://bible-api.com/${reference}`);
            const data = await response.json();
            content.innerHTML = data.text.replace(/\n/g, '<br>');
        } catch (err) {
            content.innerText = "Could not load the Bible text. Check the reference format.";
        }
    }

    function closeBible() {
        document.getElementById('bible-overlay').style.display = 'none';
    }

    // Initial Load
    fetchLiturgy(today);
</script>

</body>
</html>
