<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread | Integrated Catholic Missal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        .serif { font-family: 'Crimson Pro', serif; }
        .reading-text p { margin-bottom: 1.5rem; line-height: 1.8; }
        .label { color: #065f46; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 1rem; display: block; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; margin-top: 2.5rem; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex justify-center">

    <div id="app-card" class="max-w-2xl w-full bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-stone-200">
        
        <div class="relative h-80 bg-stone-900">
            <img id="saint-image" src="https://catholicsaints.info/wp-content/uploads/saints-marian-and-james.jpg" class="w-full h-full object-cover opacity-80" onerror="this.src='https://images.unsplash.com/photo-1544427920-c49ccfb85579?q=80&w=1000'">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent p-10 flex flex-col justify-end">
                <p id="date-label" class="text-emerald-400 text-xs font-bold uppercase tracking-[0.4em] mb-2"></p>
                <h1 id="saint-name" class="serif text-4xl text-white font-bold italic leading-tight">Daily Liturgy</h1>
                <p id="saint-bio" class="text-stone-300 text-xs mt-2 uppercase tracking-widest italic"></p>
            </div>
        </div>

        <div class="p-10">
            <div id="reading-content" class="reading-text text-lg text-stone-700">
                <div class="flex flex-col items-center py-20">
                    <div class="w-10 h-10 border-4 border-stone-100 border-t-emerald-800 rounded-full animate-spin mb-4"></div>
                    <p class="serif italic text-stone-400">Proclaiming the Word...</p>
                </div>
            </div>

            <div id="prayer-box" class="bg-emerald-900 rounded-[2.5rem] p-10 text-center text-white shadow-lg mt-10 hidden">
                <h4 class="serif text-2xl font-bold mb-4 italic">Daily Prayer</h4>
                <p id="prayer-text" class="text-emerald-100 italic leading-relaxed text-lg"></p>
            </div>
        </div>
    </div>

    <script>
        function universalisCallback(data) {
            if (!data || !data.Mass_Reading) return;

            // 1. Update Date and Saint Info
            document.getElementById('date-label').innerText = data.date;
            document.getElementById('saint-name').innerText = data.day;
            
            // Logic to provide a sub-label if a specific saint is identified
            if(data.day.includes("Marian")) {
                document.getElementById('saint-bio').innerText = "Martyrs of Numidia (d. 259 AD)";
            }

            // 2. Build Full Readings Text
            const m = data.Mass_Reading;
            let fullHtml = "";
            
            if (m.Reading1) fullHtml += `<span class="label">First Reading</span><div>${m.Reading1.text}</div>`;
            if (m.Psalm) fullHtml += `<span class="label">Responsorial Psalm</span><div class="serif italic text-emerald-900 text-xl">${m.Psalm.text}</div>`;
            if (m.Reading2) fullHtml += `<span class="label">Second Reading</span><div>${m.Reading2.text}</div>`;
            
            // Highlight the Gospel
            if (m.Gospel) {
                fullHtml += `<span class="label">Holy Gospel</span>`;
                fullHtml += `<div class="serif italic border-l-4 border-emerald-600 pl-8 py-2 text-2xl text-stone-900">${m.Gospel.text}</div>`;
            }

            // 3. Inject Content and Prayer
            document.getElementById('reading-content').innerHTML = fullHtml;
            document.getElementById('prayer-text').innerText = `Heavenly Father, through the intercession of ${data.day}, grant that we may remain firmly in You, the True Vine, and bear fruit for Your Kingdom. Amen.`;
            
            document.getElementById('prayer-box').classList.remove('hidden');
        }

        // Bridge to load data
        const script = document.createElement('script');
        // Cache-busting timestamp to prevent "Still Loading" errors in India
        script.src = `https://www.universalis.com/Europe.Ireland/jsonnext.js?callback=universalisCallback&cb=${new Date().getTime()}`;
        document.body.appendChild(script);

        // Fallback for Header if API is slow
        const today = new Date();
        document.getElementById('date-label').innerText = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    </script>
</body>
</html>
